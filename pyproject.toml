[project]
name = "flashscore-scraper"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40.0",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.23.0",
    "google-auth-oauthlib>=1.1.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
flashscore-scraper = "flashscore_scraper.main:cli"

[project.optional-dependencies]
dev = ["ruff>=0.4.0"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
quote-style = "single"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
