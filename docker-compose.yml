services:
  scraper:
    build: .
    container_name: flashscore-volleyball-scraper
    command: ["sh", "-c", "python -m flashscore_scraper --days=0; python -m flashscore_scraper --days=1"]
    environment:
      # Google Sheets configuration
      - SPREADSHEET_ID=${SPREADSHEET_ID}
      - GOOGLE_CREDENTIALS_JSON=${GOOGLE_CREDENTIALS_JSON}
      - GOOGLE_CREDENTIALS_PATH=/app/credentials.json

      # Scraper settings
      - SPORT=volleyball
      - HEADLESS=true
      - REQUEST_DELAY=1000
      - MAX_MATCHES=0

      # Sheet configuration
      # Use 'ORIGINAL' for client's original spreadsheet, 'SCRAPING OU4' for test version
      - SHEET_PRESET=${SHEET_PRESET:-ORIGINAL}
      - SHEET_TAB_NAME=${SHEET_TAB_NAME:-}
      - START_ROW=${START_ROW:-2}

    # Mount credentials file if using file-based auth
    volumes:
      - ./credentials.json:/app/credentials.json:ro
      - ./output:/app/output

    # For cron scheduling, use restart policy
    restart: "no"

    # Resource limits
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  hockey-scraper:
    build: .
    container_name: flashscore-hockey-scraper
    command: ["sh", "-c", "python -m flashscore_scraper --sport=hockey --days=0; python -m flashscore_scraper --sport=hockey --days=1"]
    environment:
      # Google Sheets configuration
      - SPREADSHEET_ID=${SPREADSHEET_ID}
      - HOCKEY_SPREADSHEET_ID=${HOCKEY_SPREADSHEET_ID:-}
      - GOOGLE_CREDENTIALS_JSON=${GOOGLE_CREDENTIALS_JSON}
      - GOOGLE_CREDENTIALS_PATH=/app/credentials.json

      # Scraper settings
      - SPORT=hockey
      - HEADLESS=true
      - REQUEST_DELAY=2000
      - MAX_MATCHES=0

      # Sheet configuration
      - SHEET_PRESET=HOCKEY RAW
      - SHEET_TAB_NAME=${HOCKEY_SHEET_TAB_NAME:-}
      - START_ROW=${START_ROW:-2}

    volumes:
      - ./credentials.json:/app/credentials.json:ro
      - ./output:/app/output

    restart: "no"

    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  football-scraper:
    build: .
    container_name: flashscore-football-scraper
    command: ["sh", "-c", "python -m flashscore_scraper --sport=football --days=0; python -m flashscore_scraper --sport=football --days=1"]
    environment:
      # Google Sheets configuration
      - SPREADSHEET_ID=${FOOTBALL_SPREADSHEET_ID:-1mgk8PG9P5H8rF7AiKDcWfrqd3hIjkZmy7OC-PVvbh80}
      - GOOGLE_CREDENTIALS_JSON=${GOOGLE_CREDENTIALS_JSON}
      - GOOGLE_CREDENTIALS_PATH=/app/credentials.json

      # Scraper settings
      - SPORT=football
      - HEADLESS=true
      - REQUEST_DELAY=2000
      - MAX_MATCHES=0

      # Sheet configuration
      - SHEET_PRESET=FOOTBALL
      - START_ROW=2

    volumes:
      - ./credentials.json:/app/credentials.json:ro
      - ./output:/app/output

    restart: "no"

    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # Optional: Scheduled runner using ofelia (cron for Docker)
  scheduler:
    image: mcuadros/ofelia:latest
    container_name: flashscore-scheduler
    depends_on:
      - scraper
      - hockey-scraper
      - football-scraper
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      ofelia.job-local.volleyball.schedule: "0 0 1 * * *"
      ofelia.job-local.volleyball.command: "/root/flashscore-scraper/run_volleyball.sh"
      ofelia.job-local.hockey.schedule: "0 0 2 * * *"
      ofelia.job-local.hockey.command: "/root/flashscore-scraper/run_hockey.sh"
      ofelia.job-local.football.schedule: "0 0 3 * * *"
      ofelia.job-local.football.command: "/root/flashscore-scraper/run_football.sh"
    profiles:
      - scheduled  # Only start with: docker compose --profile scheduled up
